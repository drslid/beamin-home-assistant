name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          activate-environment: true
      - run: uv pip install -r requirements_test.txt -r requirements_lint.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: for file in custom_components/beamin/frontend/*.js; do node --check "$file"; done

  test:
    if: github.event_name != 'schedule'
    name: test (Home Assistant 2026.9.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          activate-environment: true
      - run: uv pip install -r requirements_test.txt pytest-cov
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - run: node --test tests/js/*.test.mjs

  beta:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: test (newest harness, Home Assistant beta allowed)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          activate-environment: true
      - run: uv pip install --prerelease=allow pytest-homeassistant-custom-component home-assistant-frontend segno==1.6.6
      - run: pytest
