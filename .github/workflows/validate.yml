name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # HACS reads hacs.json and manifest.json anonymously, which fails on a private repository.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
